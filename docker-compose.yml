services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo
      POSTGRES_DB: leo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leo -d leo"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
